<?xml version="1.0" encoding="UTF-8"?>
<!--
  aka Alarm — app icon source.
  1024×1024, full-bleed, no transparency, no rounded corners.
  iOS applies the corner mask automatically; design within ~88% safe area.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dawn-sky vertical gradient: deep indigo at top, warmer dawn blue at bottom. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0A1740"/>
      <stop offset="55%"  stop-color="#0A3B96"/>
      <stop offset="100%" stop-color="#1A86FF"/>
    </linearGradient>

    <!-- Amber gradient for the wake-window arc, brighter near the top of the arc. -->
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFE6A8"/>
      <stop offset="55%"  stop-color="#FFB454"/>
      <stop offset="100%" stop-color="#FF8A1A"/>
    </linearGradient>

    <!-- Soft glow around the amber arc to make it feel luminous. -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Dial: subtle off-white ring as a base. r = 380, stroke 14. -->
  <circle cx="512" cy="512" r="380"
          fill="none" stroke="#FFF6E5" stroke-width="14" opacity="0.45"/>

  <!-- Wake-window arc: top-right quadrant, ~90°, from 12 o'clock to 3 o'clock.
       The "30-minute window" highlighted on the dial. -->
  <path d="M 512 132 A 380 380 0 0 1 892 512"
        fill="none" stroke="url(#amber)" stroke-width="36"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- Listening glyph at the center: small dot + 3 concentric rings,
       suggesting sound radiating outward / the mic always listening. -->
  <circle cx="512" cy="512" r="18" fill="#FFF6E5"/>
  <circle cx="512" cy="512" r="64"  fill="none" stroke="#FFF6E5" stroke-width="7" opacity="0.78"/>
  <circle cx="512" cy="512" r="116" fill="none" stroke="#FFF6E5" stroke-width="6" opacity="0.55"/>
  <circle cx="512" cy="512" r="170" fill="none" stroke="#FFF6E5" stroke-width="5" opacity="0.32"/>
</svg>
