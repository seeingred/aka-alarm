# aka Alarm release pipeline.
#
# Trigger: push a `vX.Y.Z` tag.
# Output: a GitHub Release with the signed Android APK + AAB attached, release
# notes auto-extracted from CHANGELOG.md. Lets Obtainium users auto-update from
# GitHub releases, gives F-Droid a build artefact to compare against, and is
# generally a single source of truth for "what shipped" without anyone touching
# Play Console or AppGallery.
#
# iOS isn't built here — App Store distribution still goes through Xcode
# Archive on a local Mac. Adding iOS would need a self-hosted Mac runner +
# Apple cert/profile secret plumbing; not worth the GH Actions minutes for now.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of android/aka-alarm-upload.jks
#                             `base64 -i android/aka-alarm-upload.jks | pbcopy`
#   ANDROID_KEYSTORE_PASSWORD storePassword from keystore.properties
#   ANDROID_KEY_ALIAS         keyAlias from keystore.properties (aka-alarm-upload)
#   ANDROID_KEY_PASSWORD      keyPassword from keystore.properties

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # to create the GitHub Release

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — release builds need it"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/aka-alarm-upload.jks
          ls -l android/aka-alarm-upload.jks

      - name: Write keystore.properties
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=$PWD/android/aka-alarm-upload.jks
          storePassword=$STORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF

      - name: Build signed APK + AAB
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Stash artefacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

  release:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Android artefacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-release

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # Pull the section between this version's heading and the next ## heading.
          # CHANGELOG headings look like:  ## 1.1.0 — 2026-05-27
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$|—)" { found=1; next }
            found && /^## [0-9]/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No matching CHANGELOG section found for v$VERSION — falling back to tag message."
            git log -1 --format=%B "$GITHUB_REF" > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Rename artefacts with version
        run: |
          V="${GITHUB_REF#refs/tags/}"
          mkdir -p out
          for f in android-release/apk/release/*.apk; do
            cp "$f" "out/aka-alarm-${V}.apk"
          done
          for f in android-release/bundle/release/*.aab; do
            cp "$f" "out/aka-alarm-${V}.aab"
          done
          ls -l out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: aka Alarm ${{ steps.notes.outputs.VERSION }}
          body_path: release-notes.md
          files: out/*
          draft: false
          prerelease: false
          generate_release_notes: false
